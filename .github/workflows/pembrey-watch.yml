name: Pembrey NOTAM watch

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  watch-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Pembrey alert watcher
        env:
          OUTPUT_FILE: data/pembrey-notam.json
          STATE_FILE: data/pembrey-state.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIDE_URL: ${{ vars.TIDE_URL || 'https://www.tide-forecast.com/locations/Pembroke-Dock/tides/latest' }}
        run: npm run pembrey-watch

      - name: Ensure static site data exists
        run: |
          mkdir -p site/data
          if [ -f data/pembrey-notam.json ]; then
            cp data/pembrey-notam.json site/data/pembrey-notam.json
          else
            printf '%s\n' '{"generatedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","notams":[]}' > site/data/pembrey-notam.json
          fi

      - name: Commit watcher output and site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pembrey-state.json data/pembrey-notam.json site/index.html site/data/pembrey-notam.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Pembrey alert data"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: watch-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
