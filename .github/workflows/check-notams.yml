name: Check NOTAMs

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run check-notams
        env:
          OUTPUT_FILE: data/notams.json
        run: npm run check-notams

      - name: Upload notams.json
        uses: actions/upload-artifact@v4
        with:
          name: notams
          path: data/notams.json
